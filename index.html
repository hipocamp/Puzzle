<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Puzzle Toledo 4x4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            touch-action: none; 
            background-color: #0f172a; 
            color: white; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        
        /* Tauler 4x4 amb la proporció del pòster (aprox 2:3) */
        #puzzle-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 2px;
            width: 85vw;
            max-width: 380px;
            aspect-ratio: 2 / 3;
            background-color: #1e293b;
            border: 4px solid #facc15;
            margin: 0 auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .piece {
            background-image: url('Toledo.jpeg');
            background-size: 400% 400%; /* Important per a 4x4 */
            cursor: pointer;
            transition: transform 0.1s;
            border-radius: 2px;
        }

        .piece:active {
            transform: scale(0.96);
        }

        .empty {
            background: #0f172a !important;
            cursor: default;
        }

        .win-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="text-center py-6">
        <h1 class="text-2xl font-black italic text-yellow-400 uppercase tracking-tighter leading-none">III VUELTA CICLISTA</h1>
        <p class="text-sm font-bold text-white uppercase tracking-widest mt-1">TOLEDO 4x4</p>
    </header>

    <main class="flex-grow flex items-center justify-center">
        <div id="puzzle-board"></div>
    </main>

    <footer class="p-8 text-center">
        <button onclick="shuffleGame()" class="bg-yellow-500 hover:bg-yellow-400 text-black px-12 py-3 rounded-full font-black uppercase italic shadow-lg transition-all active:scale-95">
            Barrejar Peçes
        </button>
        <div class="mt-8">
            <a href="https://neurekalab.com" target="_blank" class="text-[10px] text-slate-500 tracking-[0.3em] uppercase font-bold italic">By NeurekaLAB</a>
        </div>
    </footer>

    <!-- Pantalla de Victòria -->
    <div id="win-screen" class="win-overlay">
        <div class="p-10">
            <h2 class="text-5xl font-black italic text-yellow-400 mb-4 uppercase">ÈXIT TOTAL!</h2>
            <p class="text-white text-lg mb-8">Has reconstruït el pòster de la Vuelta.</p>
            <button onclick="shuffleGame()" class="bg-white text-black px-12 py-4 rounded-full font-black uppercase tracking-widest shadow-2xl">
                Tornar a jugar
            </button>
        </div>
    </div>

    <script>
        const board = document.getElementById('puzzle-board');
        const winScreen = document.getElementById('win-screen');
        const size = 4;
        const totalPieces = size * size;
        let pieces = Array.from({length: totalPieces}, (_, i) => i);
        const emptyValue = totalPieces - 1; // La peça 15 és el buit

        function createBoard() {
            board.innerHTML = '';
            pieces.forEach((pieceValue, index) => {
                const div = document.createElement('div');
                div.className = 'piece';
                
                if (pieceValue === emptyValue) {
                    div.classList.add('empty');
                } else {
                    // Càlcul de la posició del fons per a 4x4
                    const row = Math.floor(pieceValue / size);
                    const col = pieceValue % size;
                    // En 4 files, els salts són de 33.333% (0, 33, 66, 100)
                    const xPercent = (col / (size - 1)) * 100;
                    const yPercent = (row / (size - 1)) * 100;
                    div.style.backgroundPosition = `${xPercent}% ${yPercent}%`;
                }
                
                div.onclick = () => movePiece(index);
                board.appendChild(div);
            });
        }

        function movePiece(index) {
            const emptyIndex = pieces.indexOf(emptyValue);
            if (isAdjacent(index, emptyIndex)) {
                // Intercanvi
                [pieces[index], pieces[emptyIndex]] = [pieces[emptyIndex], pieces[index]];
                createBoard();
                checkWin();
            }
        }

        function isAdjacent(idx1, idx2) {
            const r1 = Math.floor(idx1 / size);
            const c1 = idx1 % size;
            const r2 = Math.floor(idx2 / size);
            const c2 = idx2 % size;
            return (Math.abs(r1 - r2) + Math.abs(c1 - c2)) === 1;
        }

        function shuffleGame() {
            winScreen.style.display = 'none';
            let moves = 0;
            const maxMoves = 120; // Per a 4x4 calen més moviments per desordenar bé
            
            const interval = setInterval(() => {
                const emptyIdx = pieces.indexOf(emptyValue);
                const possibleMoves = [];
                for(let i=0; i < totalPieces; i++) {
                    if(isAdjacent(i, emptyIdx)) possibleMoves.push(i);
                }
                const randomIdx = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                [pieces[randomIdx], pieces[emptyIdx]] = [pieces[emptyIdx], pieces[randomIdx]];
                
                createBoard();
                moves++;
                if (moves >= maxMoves) clearInterval(interval);
            }, 10);
        }

        function checkWin() {
            const win = pieces.every((val, i) => val === i);
            if (win) {
                setTimeout(() => {
                    winScreen.style.display = 'flex';
                }, 400);
            }
        }

        // Inicialitzar
        createBoard();
    </script>
</body>
</html>
