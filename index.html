<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Puzzle Toledo 4x4 - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            touch-action: none; 
            background-color: #0f172a; 
            color: white; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        
        #puzzle-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 2px;
            width: 85vw;
            max-width: 380px;
            aspect-ratio: 2 / 3;
            background-color: #1e293b;
            border: 4px solid #facc15;
            margin: 0 auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .piece {
            background-image: url('Toledo.jpeg');
            background-size: 400% 400%;
            cursor: pointer;
            transition: transform 0.1s;
            border-radius: 2px;
        }

        .piece:active { transform: scale(0.96); }

        .empty { background: #0f172a !important; cursor: default; }

        .win-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .stat-box {
            background: #1e293b;
            padding: 5px 15px;
            border-radius: 10px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="text-center py-4">
        <h1 class="text-xl font-black italic text-yellow-400 uppercase tracking-tighter leading-none">III VUELTA CICLISTA</h1>
        
        <!-- CRONÒMETRE I RÈCORD -->
        <div class="flex justify-center gap-4 mt-4">
            <div class="stat-box">
                <p class="text-[9px] uppercase font-bold text-slate-400">Temps</p>
                <p id="timer" class="text-xl font-mono font-black text-white">00:00</p>
            </div>
            <div class="stat-box">
                <p class="text-[9px] uppercase font-bold text-slate-400">Millor Rècord</p>
                <p id="best-time" class="text-xl font-mono font-black text-yellow-500">--:--</p>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center">
        <div id="puzzle-board"></div>
    </main>

    <footer class="p-8 text-center">
        <button onclick="shuffleGame()" class="bg-yellow-500 hover:bg-yellow-400 text-black px-12 py-3 rounded-full font-black uppercase italic shadow-lg transition-all active:scale-95">
            Barrejar peces
        </button>
        <div class="mt-6">
            <a href="https://neurekalab.com" target="_blank" class="text-[10px] text-slate-500 tracking-[0.3em] uppercase font-bold italic">By NeurekaLAB</a>
        </div>
    </footer>

    <!-- Pantalla de Victòria -->
    <div id="win-screen" class="win-overlay">
        <div class="p-10">
            <h2 class="text-5xl font-black italic text-yellow-400 mb-2 uppercase">FELICITATS!</h2>
            <p class="text-white text-lg mb-1">Has completat la cursa en:</p>
            <p id="final-time" class="text-4xl font-mono font-black text-white mb-8">00:00</p>
            
            <button onclick="shuffleGame()" class="bg-white text-black px-12 py-4 rounded-full font-black uppercase tracking-widest shadow-2xl">
                Tornar a jugar
            </button>
        </div>
    </div>

    <script>
        const board = document.getElementById('puzzle-board');
        const winScreen = document.getElementById('win-screen');
        const timerDisplay = document.getElementById('timer');
        const bestTimeDisplay = document.getElementById('best-time');
        const finalTimeDisplay = document.getElementById('final-time');

        const size = 4;
        const totalPieces = size * size;
        let pieces = Array.from({length: totalPieces}, (_, i) => i);
        const emptyValue = totalPieces - 1;

        // Variables Cronòmetre
        let timerInterval;
        let seconds = 0;
        let gameRunning = false;

        // Carregar Rècord
        let bestTime = localStorage.getItem('puzzle_toledo_best_time');
        if (bestTime) bestTimeDisplay.innerText = formatTime(bestTime);

        function formatTime(s) {
            const mins = Math.floor(s / 60).toString().padStart(2, '0');
            const secs = (s % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        function createBoard() {
            board.innerHTML = '';
            pieces.forEach((pieceValue, index) => {
                const div = document.createElement('div');
                div.className = 'piece';
                if (pieceValue === emptyValue) {
                    div.classList.add('empty');
                } else {
                    const row = Math.floor(pieceValue / size);
                    const col = pieceValue % size;
                    const xPercent = (col / (size - 1)) * 100;
                    const yPercent = (row / (size - 1)) * 100;
                    div.style.backgroundPosition = `${xPercent}% ${yPercent}%`;
                }
                div.onclick = () => movePiece(index);
                board.appendChild(div);
            });
        }

        function movePiece(index) {
            const emptyIndex = pieces.indexOf(emptyValue);
            if (isAdjacent(index, emptyIndex)) {
                [pieces[index], pieces[emptyIndex]] = [pieces[emptyIndex], pieces[index]];
                createBoard();
                checkWin();
            }
        }

        function isAdjacent(idx1, idx2) {
            const r1 = Math.floor(idx1 / size);
            const c1 = idx1 % size;
            const r2 = Math.floor(idx2 / size);
            const c2 = idx2 % size;
            return (Math.abs(r1 - r2) + Math.abs(c1 - c2)) === 1;
        }

        function shuffleGame() {
            winScreen.style.display = 'none';
            // Reset Cronòmetre
            clearInterval(timerInterval);
            seconds = 0;
            timerDisplay.innerText = "00:00";
            gameRunning = false;

            let moves = 0;
            const maxMoves = 120;
            
            const interval = setInterval(() => {
                const emptyIdx = pieces.indexOf(emptyValue);
                const possibleMoves = [];
                for(let i=0; i < totalPieces; i++) {
                    if(isAdjacent(i, emptyIdx)) possibleMoves.push(i);
                }
                const randomIdx = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                [pieces[randomIdx], pieces[emptyIdx]] = [pieces[emptyIdx], pieces[randomIdx]];
                
                createBoard();
                moves++;
                if (moves >= maxMoves) {
                    clearInterval(interval);
                    startTimer(); // El cronòmetre comença després de barrejar
                }
            }, 10);
        }

        function startTimer() {
            gameRunning = true;
            timerInterval = setInterval(() => {
                seconds++;
                timerDisplay.innerText = formatTime(seconds);
            }, 1000);
        }

        function checkWin() {
            const win = pieces.every((val, i) => val === i);
            if (win && gameRunning) {
                gameRunning = false;
                clearInterval(timerInterval);
                finalTimeDisplay.innerText = formatTime(seconds);
                
                // Guardar Rècord
                if (!bestTime || seconds < bestTime) {
                    bestTime = seconds;
                    localStorage.setItem('puzzle_toledo_best_time', bestTime);
                    bestTimeDisplay.innerText = formatTime(bestTime);
                }

                setTimeout(() => {
                    winScreen.style.display = 'flex';
                }, 400);
            }
        }

        createBoard();
    </script>
</body>
</html>
