<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Puzzle Ciclista Toledo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { touch-action: none; background-color: #1a1a1a; color: white; overflow: hidden; }
        
        /* El puzzle manté la proporció de la imatge vertical */
        #puzzle-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            width: 90vw;
            max-width: 400px;
            aspect-ratio: 2 / 3; /* Proporció del pòster */
            background-color: #333;
            border: 4px solid #d4af37; /* Marc daurat com el pòster */
            margin: 0 auto;
        }

        .piece {
            background-image: url('toledo.jpg');
            background-size: 300% 300%; /* Perquè cada peça mostri només la seva part */
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 4px;
        }

        .empty {
            background: #1a1a1a !important;
            cursor: default;
        }

        .win-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 50;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen font-sans">

    <header class="text-center py-6">
        <h1 class="text-xl font-black italic text-yellow-500 uppercase tracking-tighter">III VUELTA CICLISTA</h1>
        <p class="text-[10px] uppercase font-bold text-gray-400">Puzzle de lliscament clàssic</p>
    </header>

    <main class="flex-grow flex items-center justify-center">
        <div id="puzzle-board"></div>
    </main>

    <footer class="p-6 text-center">
        <button onclick="shuffleGame()" class="bg-yellow-600 text-black px-8 py-3 rounded-full font-black uppercase italic shadow-lg active:scale-95 transition-transform">
            Barrejar Peçes
        </button>
        <p class="mt-8 text-[9px] text-gray-500 tracking-widest uppercase italic">By NeurekaLAB</p>
    </footer>

    <!-- Pantalla de Victòria -->
    <div id="win-screen" class="win-overlay">
        <h2 class="text-4xl font-black italic text-yellow-500 mb-2">VICTÒRIA!</h2>
        <p class="text-white mb-8">Has completat el recorregut.</p>
        <button onclick="shuffleGame()" class="bg-white text-black px-10 py-3 rounded-full font-bold uppercase">Tornar a jugar</button>
    </div>

    <script>
        const board = document.getElementById('puzzle-board');
        const winScreen = document.getElementById('win-screen');
        let pieces = [0, 1, 2, 3, 4, 5, 6, 7, 8]; // 8 és el forat buit
        
        // Crear el tauler inicial
        function createBoard() {
            board.innerHTML = '';
            pieces.forEach((pos, index) => {
                const div = document.createElement('div');
                div.className = 'piece';
                if (pos === 8) {
                    div.classList.add('empty');
                } else {
                    // Càlcul de la part de la imatge que ha de mostrar cada peça
                    const row = Math.floor(pos / 3);
                    const col = pos % 3;
                    div.style.backgroundPosition = `${col * 50}% ${row * 50}%`;
                }
                
                div.onclick = () => movePiece(index);
                board.appendChild(div);
            });
        }

        function movePiece(index) {
            const emptyIndex = pieces.indexOf(8);
            const validMoves = getValidMoves(emptyIndex);

            if (validMoves.includes(index)) {
                // Intercanviar posicions
                [pieces[index], pieces[emptyIndex]] = [pieces[emptyIndex], pieces[index]];
                createBoard();
                checkWin();
            }
        }

        function getValidMoves(emptyIdx) {
            const moves = [];
            const row = Math.floor(emptyIdx / 3);
            const col = emptyIdx % 3;

            if (row > 0) moves.push(emptyIdx - 3); // A dalt
            if (row < 2) moves.push(emptyIdx + 3); // A baix
            if (col > 0) moves.push(emptyIdx - 1); // Esquerra
            if (col < 2) moves.push(emptyIdx + 1); // Dreta
            
            return moves;
        }

        function shuffleGame() {
            winScreen.style.display = 'none';
            // Perquè sigui resoluble, fem moviments aleatoris reals des de la posició resolta
            let iterations = 0;
            let currentEmpty = pieces.indexOf(8);
            
            const interval = setInterval(() => {
                const moves = getValidMoves(pieces.indexOf(8));
                const randomMove = moves[Math.floor(Math.random() * moves.length)];
                
                const emptyIdx = pieces.indexOf(8);
                [pieces[randomMove], pieces[emptyIdx]] = [pieces[emptyIdx], pieces[randomMove]];
                
                createBoard();
                iterations++;
                if (iterations > 30) clearInterval(interval);
            }, 50);
        }

        function checkWin() {
            const isWin = pieces.every((val, i) => val === i);
            if (isWin) {
                setTimeout(() => {
                    winScreen.style.display = 'flex';
                }, 500);
            }
        }

        // Iniciar
        createBoard();
    </script>
</body>
</html>
